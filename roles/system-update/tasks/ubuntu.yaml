- name: Upgrade all Debian/Ubuntu packages
  become: true
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: "{{ system_update_autoremove }}"
  register: system_update_apt

- name: Check if Debian/Ubuntu requires a reboot
  become: true
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: system_update_reboot_required_file

- name: Reboot host if required
  become: true
  throttle: 1
  ansible.builtin.reboot:
    msg: "Reboot initiated by Ansible after system updates"
    connect_timeout: 5
    reboot_timeout: "{{ system_update_reboot_timeout }}"
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
  when:
    - system_update_reboot
    - system_update_reboot_required_file.stat.exists | default(false)
