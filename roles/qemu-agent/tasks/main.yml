---

- name: Install qemu-guest-agent
  become: true
  become_user: root
  community.general.apk:
    name:
      - qemu-guest-agent
    state: latest
    update_cache: true

- name: Enable service qemu-guest-agent
  become: true
  become_user: root
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true

- name: Start service qemu-guest-agent, if not started
  become: true
  become_user: root
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
