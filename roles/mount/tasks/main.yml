---
- name: Install mount package
  become: true
  become_user: root
  community.general.apk:
    update_cache: true
    name:
      - mount
      - nfs-utils
    state: latest

- name: Install linux-lts kernel
  become: true
  become_user: root
  community.general.apk:
    update_cache: true
    name:
      - linux-lts
    state: latest
  notify: Reboot machine

- name: Remove linux-virt kernel
  become: true
  become_user: root
  community.general.apk:
    name: linux-virt
    state: absent

- name: Mount data from NAS
  become: true
  become_user: root
  ansible.posix.mount:
    src: "{{ network_drive }}"
    path: "{{ mount_target }}"
    opts: "rw,async,hard,relatime"
    fstype: nfs
    state: mounted

- name: Enable netmount on boot
  become: true
  become_user: root
  ansible.builtin.service:
    name: netmount
    enabled: true
    runlevel: boot
