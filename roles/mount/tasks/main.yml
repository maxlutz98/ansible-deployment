---
- name: Install mount package
  become: true
  become_user: root
  community.general.apk:
    update_cache: true
    name:
      - mount
      - cifs-utils
    state: latest

- name: Install linux-lts kernel
  become: true
  become_user: root
  community.general.apk:
    update_cache: true
    name:
      - linux-lts
    state: latest
  notify: Reboot machine

- name: Remove linux-virt kernel
  become: true
  become_user: root
  community.general.apk:
    name: linux-virt
    state: absent

- name: Mount data from NAS
  become: true
  become_user: root
  ansible.posix.mount:
    src: //192.168.200.5/data
    path: "{{ mount_target }}"
    opts: "rw,file_mode=0664,dir_mode=0775,username={{ ad_username }},password={{ ad_password }},uid=1000,gid=100"
    opts_no_log: true
    fstype: cifs
    state: mounted

- name: Enable netmount on boot
  become: true
  become_user: root
  ansible.builtin.service:
    name: netmount
    enabled: true
    runlevel: boot
